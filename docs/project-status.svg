<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" rx="28" fill="#091224"/>
  <rect x="1" y="1" width="1198" height="678" rx="27" fill="none" stroke="#243152" stroke-width="2"/>

  <style>
    .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #f5f7ff; }
    .sub { font: 500 18px "Segoe UI", Arial, sans-serif; fill: #aab4da; }
    .section { font: 700 26px "Segoe UI", Arial, sans-serif; fill: #f5f7ff; }
    .body { font: 500 18px "Segoe UI", Arial, sans-serif; fill: #dfe5ff; }
    .small { font: 500 14px "Segoe UI", Arial, sans-serif; fill: #8d97bd; }
    .trackLabel { font: 600 20px "Segoe UI", Arial, sans-serif; fill: #f0f3ff; }
    .trackMeta { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #8fa8ff; letter-spacing: 1px; }
    .value { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #f5f7ff; }
  </style>

  <text x="56" y="74" class="title">PROJECTMOYLE</text>
  <text x="56" y="108" class="sub">Bugs Bunny: Lost in Time · PAL SLES_017.26</text>

  <text x="56" y="168" class="section">First-boot bring-up</text>
  <text x="56" y="202" class="body">
    Native-port and static-recompilation project for the original PlayStation release.
  </text>

  <text x="56" y="260" class="section">Development snapshot</text>
  <text x="56" y="288" class="small">Qualitative progress bars · not an exact overall completion percentage</text>

  <!-- Track 1 -->
  <text x="56" y="352" class="trackLabel">Static recompilation</text>
  <text x="1090" y="352" text-anchor="end" class="value">Operational</text>
  <rect x="56" y="372" width="1088" height="22" rx="11" fill="#1a2443"/>
  <rect x="56" y="372" width="1000" height="22" rx="11" fill="#5fe0c6"/>
  <text x="56" y="422" class="trackMeta">Core recompilation path established</text>

  <!-- Track 2 -->
  <text x="56" y="474" class="trackLabel">Runtime bring-up</text>
  <text x="1090" y="474" text-anchor="end" class="value">Active</text>
  <rect x="56" y="494" width="1088" height="22" rx="11" fill="#1a2443"/>
  <rect x="56" y="494" width="860" height="22" rx="11" fill="#69a7ff"/>
  <text x="56" y="544" class="trackMeta">Interrupts, GPU, CD-ROM and SPU activity observed</text>

  <!-- Track 3 -->
  <text x="56" y="596" class="trackLabel">Current blocker</text>
  <text x="1090" y="596" text-anchor="end" class="value">DMA6 / OTC</text>
  <rect x="56" y="616" width="1088" height="22" rx="11" fill="#1a2443"/>
  <rect x="56" y="616" width="350" height="22" rx="11" fill="#f0b44f"/>
</svg>
